# 推送到 main 后自动构建并发布到 GitHub Pages。
# 第一次用：仓库 Settings → Pages → Source 选 “GitHub Actions”。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install ffmpeg (auto covers & thumbnails)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - uses: actions/cache@v4
        with:
          path: .cache
          key: reel-cache-${{ hashFiles('reel.config.json') }}
          restore-keys: reel-cache-
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" # 录制用的浏览器部署时用不到
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
